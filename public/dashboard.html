<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCG QA Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .tier-Critical { color: #b91c1c; }
    .tier-Below { color: #ea580c; }
    .tier-Meets { color: #0369a1; }
    .tier-Exceeds { color: #047857; }
    .tier-Exemplary { color: #6d28d9; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const {
      LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer,
      CartesianGrid, Legend, ReferenceLine,
    } = Recharts;

    function tierClass(tier) {
      if (!tier) return '';
      return 'tier-' + tier.split(' ')[0];
    }

    async function fetchJson(url, opts) {
      const r = await fetch(url, opts);
      if (!r.ok) throw new Error(`${url} → ${r.status}`);
      return r.json();
    }

    function Pill({ children, color = 'slate' }) {
      return <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium bg-${color}-100 text-${color}-800 border border-${color}-200`}>{children}</span>;
    }

    function ScoreBadge({ score, tier }) {
      const cls = tier ? `tier-${tier.split(' ')[0]}` : '';
      return (
        <span className={`font-semibold ${cls}`}>
          {typeof score === 'number' ? score.toFixed(2) : '—'} {tier ? `(${tier})` : ''}
        </span>
      );
    }

    function App() {
      const [view, setView] = useState({ name: 'overview' });
      const [analyses, setAnalyses] = useState([]);
      const [instructors, setInstructors] = useState([]);
      const [needsReview, setNeedsReview] = useState([]);
      const [status, setStatus] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [filter, setFilter] = useState({ campus: '', instructor: '', minScore: '', maxScore: '' });

      async function refresh() {
        setLoading(true);
        setError(null);
        try {
          const [a, i, n, s] = await Promise.all([
            fetchJson('/api/analyses'),
            fetchJson('/api/instructors'),
            fetchJson('/api/needs-review'),
            fetchJson('/api/status'),
          ]);
          setAnalyses(a.analyses || []);
          setInstructors(i.instructors || []);
          setNeedsReview(n.instructors || []);
          setStatus(s);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      }

      useEffect(() => { refresh(); }, []);

      const filtered = useMemo(() => {
        return analyses.filter(a => {
          if (filter.campus && a.campus !== filter.campus) return false;
          if (filter.instructor && a.instructorEmail !== filter.instructor) return false;
          if (filter.minScore && a.overallScore < Number(filter.minScore)) return false;
          if (filter.maxScore && a.overallScore > Number(filter.maxScore)) return false;
          return true;
        });
      }, [analyses, filter]);

      const campuses = useMemo(() => [...new Set(analyses.map(a => a.campus).filter(Boolean))], [analyses]);

      return (
        <div className="max-w-7xl mx-auto p-6">
          <header className="flex justify-between items-start mb-6">
            <div>
              <h1 className="text-2xl font-bold">MCG Career College — Instructor QA</h1>
              <p className="text-sm text-slate-600">
                Automated performance reports from BBB + Moodle + Deepgram + Claude.
                Outputs are <strong>evidentiary inputs</strong> — never grounds for automatic discipline.
              </p>
            </div>
            <div className="flex gap-2">
              <button className="px-3 py-1 text-sm rounded border bg-white hover:bg-slate-50" onClick={refresh}>Refresh</button>
              <button
                className="px-3 py-1 text-sm rounded bg-slate-900 text-white hover:bg-slate-800"
                onClick={async () => {
                  await fetch('/api/sync', { method: 'POST' });
                  alert('Sync started in background. Check /api/status and console for progress.');
                }}>
                Trigger Sync
              </button>
            </div>
          </header>

          <nav className="flex gap-2 mb-6 border-b">
            {[
              ['overview', 'Overview'],
              ['instructors', 'Instructors'],
              ['needs-review', `Needs Review (${needsReview.length})`],
              ['alerts', 'Alerts'],
              ['system', 'System'],
            ].map(([k, label]) => (
              <button
                key={k}
                className={`px-3 py-2 text-sm border-b-2 -mb-px ${view.name === k ? 'border-slate-900 font-semibold' : 'border-transparent text-slate-500'}`}
                onClick={() => setView({ name: k })}>
                {label}
              </button>
            ))}
          </nav>

          {error && <div className="bg-red-50 border border-red-200 text-red-800 p-3 rounded mb-4">{error}</div>}
          {loading && <div className="text-slate-500">Loading…</div>}

          {view.name === 'overview' && (
            <OverviewView analyses={filtered} campuses={campuses} instructors={instructors} filter={filter} setFilter={setFilter} setView={setView} />
          )}
          {view.name === 'instructors' && (
            <InstructorsView instructors={instructors} analyses={analyses} setView={setView} />
          )}
          {view.name === 'instructor-detail' && (
            <InstructorDetail email={view.email} setView={setView} />
          )}
          {view.name === 'session-detail' && (
            <SessionDetail recordID={view.recordID} setView={setView} />
          )}
          {view.name === 'needs-review' && (
            <NeedsReviewView needsReview={needsReview} />
          )}
          {view.name === 'alerts' && (
            <AlertsView />
          )}
          {view.name === 'system' && (
            <SystemView status={status} />
          )}
        </div>
      );
    }

    function OverviewView({ analyses, campuses, instructors, filter, setFilter, setView }) {
      return (
        <div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <Stat label="Total sessions" value={analyses.length} />
            <Stat label="Avg score" value={analyses.length ? (analyses.reduce((s, a) => s + (a.overallScore || 0), 0) / analyses.length).toFixed(2) : '—'} />
            <Stat label="Red flags" value={analyses.filter(a => a.hasRedFlags).length} accent="red" />
            <Stat label="Below standard" value={analyses.filter(a => a.overallScore < 2.5).length} accent="amber" />
          </div>

          <div className="flex flex-wrap gap-2 mb-4 items-center">
            <select className="border rounded px-2 py-1 text-sm" value={filter.campus} onChange={e => setFilter({ ...filter, campus: e.target.value })}>
              <option value="">All campuses</option>
              {campuses.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select className="border rounded px-2 py-1 text-sm" value={filter.instructor} onChange={e => setFilter({ ...filter, instructor: e.target.value })}>
              <option value="">All instructors</option>
              {instructors.map(i => <option key={i.email} value={i.email}>{i.name || i.email}</option>)}
            </select>
            <input className="border rounded px-2 py-1 text-sm w-24" placeholder="min score" value={filter.minScore} onChange={e => setFilter({ ...filter, minScore: e.target.value })} />
            <input className="border rounded px-2 py-1 text-sm w-24" placeholder="max score" value={filter.maxScore} onChange={e => setFilter({ ...filter, maxScore: e.target.value })} />
          </div>

          {analyses.length > 0 ? (
            <div className="bg-white border rounded h-64 mb-6">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={analyses.slice(0, 30).map(a => ({ name: a.sessionDate || a.recordID.slice(0, 6), score: a.overallScore || 0 }))}>
                  <CartesianGrid strokeDasharray="3 3" />
                  <XAxis dataKey="name" />
                  <YAxis domain={[0, 5]} />
                  <Tooltip />
                  <ReferenceLine y={2.5} stroke="#ea580c" strokeDasharray="3 3" />
                  <Bar dataKey="score" fill="#0369a1" />
                </BarChart>
              </ResponsiveContainer>
            </div>
          ) : null}

          <div className="bg-white border rounded overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 text-left">
                <tr>
                  <th className="p-2">Date</th>
                  <th className="p-2">Instructor</th>
                  <th className="p-2">Course</th>
                  <th className="p-2">Campus</th>
                  <th className="p-2">Score</th>
                  <th className="p-2">Tier</th>
                  <th className="p-2">Flags</th>
                </tr>
              </thead>
              <tbody>
                {analyses.map(a => (
                  <tr key={a.recordID} className="border-t hover:bg-slate-50 cursor-pointer" onClick={() => setView({ name: 'session-detail', recordID: a.recordID })}>
                    <td className="p-2">{a.sessionDate || '—'}</td>
                    <td className="p-2">{a.instructorName || a.instructorEmail}</td>
                    <td className="p-2">{a.courseCode || a.courseName || '—'}</td>
                    <td className="p-2">{a.campus || '—'}</td>
                    <td className="p-2"><ScoreBadge score={a.overallScore} /></td>
                    <td className={`p-2 ${tierClass(a.tier)}`}>{a.tier || '—'}</td>
                    <td className="p-2">{a.hasRedFlags ? <Pill color="red">flag</Pill> : ''}</td>
                  </tr>
                ))}
                {!analyses.length && (
                  <tr><td colSpan={7} className="p-4 text-center text-slate-500">No analyses yet. Trigger a sync after recordings are produced.</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function Stat({ label, value, accent }) {
      const colour = accent === 'red' ? 'text-red-700' : accent === 'amber' ? 'text-amber-700' : 'text-slate-900';
      return (
        <div className="bg-white border rounded p-3">
          <div className="text-xs text-slate-500">{label}</div>
          <div className={`text-2xl font-bold ${colour}`}>{value}</div>
        </div>
      );
    }

    function InstructorsView({ instructors, analyses, setView }) {
      const stats = useMemo(() => {
        const m = new Map();
        for (const a of analyses) {
          const key = a.instructorEmail || 'unknown';
          const cur = m.get(key) || { count: 0, sum: 0, last: null };
          cur.count += 1;
          cur.sum += a.overallScore || 0;
          if (!cur.last || (a.sessionDate || '') > (cur.last || '')) cur.last = a.sessionDate;
          m.set(key, cur);
        }
        return m;
      }, [analyses]);
      return (
        <div className="bg-white border rounded overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-100 text-left">
              <tr>
                <th className="p-2">Name</th>
                <th className="p-2">Email</th>
                <th className="p-2">Campus</th>
                <th className="p-2">Status</th>
                <th className="p-2">Sessions</th>
                <th className="p-2">Avg score</th>
                <th className="p-2">Last seen</th>
              </tr>
            </thead>
            <tbody>
              {instructors.map(i => {
                const s = stats.get(i.email) || { count: 0, sum: 0, last: null };
                return (
                  <tr key={i.email} className="border-t hover:bg-slate-50 cursor-pointer" onClick={() => setView({ name: 'instructor-detail', email: i.email })}>
                    <td className="p-2">{i.name}</td>
                    <td className="p-2">{i.email}</td>
                    <td className="p-2">{i.campus || '—'}</td>
                    <td className="p-2">{i.status === 'needs-review' ? <Pill color="amber">needs review</Pill> : <Pill color="green">active</Pill>}</td>
                    <td className="p-2">{s.count}</td>
                    <td className="p-2">{s.count ? (s.sum / s.count).toFixed(2) : '—'}</td>
                    <td className="p-2">{s.last || '—'}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    function InstructorDetail({ email, setView }) {
      const [history, setHistory] = useState([]);
      const [profile, setProfile] = useState(null);
      useEffect(() => {
        Promise.all([
          fetchJson(`/api/instructor/${encodeURIComponent(email)}/history`),
          fetchJson(`/api/instructor/${encodeURIComponent(email)}`),
        ]).then(([h, p]) => { setHistory(h.history || []); setProfile(p); });
      }, [email]);
      return (
        <div>
          <button className="text-sm text-slate-500 mb-2" onClick={() => setView({ name: 'instructors' })}>← Back</button>
          {profile && (
            <div className="mb-4">
              <h2 className="text-xl font-semibold">{profile.name}</h2>
              <div className="text-sm text-slate-500">{profile.email} · {profile.campus || '—'}</div>
            </div>
          )}
          {history.length > 0 && (
            <div className="bg-white border rounded h-64 mb-4">
              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={history.map(h => ({ date: h.date, score: h.score }))}>
                  <CartesianGrid strokeDasharray="3 3" />
                  <XAxis dataKey="date" />
                  <YAxis domain={[0, 5]} />
                  <Tooltip />
                  <ReferenceLine y={2.5} stroke="#ea580c" strokeDasharray="3 3" />
                  <Line type="monotone" dataKey="score" stroke="#0369a1" strokeWidth={2} dot />
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}
          <div className="bg-white border rounded overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 text-left">
                <tr>
                  <th className="p-2">Date</th>
                  <th className="p-2">Course</th>
                  <th className="p-2">Topic</th>
                  <th className="p-2">Score</th>
                  <th className="p-2">Tier</th>
                </tr>
              </thead>
              <tbody>
                {history.map((h, idx) => (
                  <tr key={idx} className="border-t hover:bg-slate-50 cursor-pointer" onClick={() => setView({ name: 'session-detail', recordID: h.recordID })}>
                    <td className="p-2">{h.date}</td>
                    <td className="p-2">{h.courseCode || '—'}</td>
                    <td className="p-2">{h.sessionTopic || '—'}</td>
                    <td className="p-2">{typeof h.score === 'number' ? h.score.toFixed(2) : '—'}</td>
                    <td className={`p-2 ${tierClass(h.tier)}`}>{h.tier || '—'}</td>
                  </tr>
                ))}
                {!history.length && <tr><td colSpan={5} className="p-4 text-center text-slate-500">No sessions yet.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function SessionDetail({ recordID, setView }) {
      const [a, setA] = useState(null);
      const [replies, setReplies] = useState([]);
      useEffect(() => {
        fetchJson(`/api/analysis/${encodeURIComponent(recordID)}`).then(setA);
        fetchJson(`/api/right-of-reply/${encodeURIComponent(recordID)}`).then(r => setReplies(r.replies || []));
      }, [recordID]);
      if (!a) return <div className="text-slate-500">Loading…</div>;
      const m = a.session_meta || {};
      return (
        <div>
          <button className="text-sm text-slate-500 mb-2" onClick={() => setView({ name: 'overview' })}>← Back</button>
          <h2 className="text-xl font-semibold">{m.session_topic || a.recordID}</h2>
          <div className="text-sm text-slate-500 mb-4">
            {m.instructor_name} ({m.instructor_email}) · {m.course_name} · {m.session_date} · {m.campus}
          </div>
          <div className="grid md:grid-cols-3 gap-3 mb-4">
            <Stat label="Overall" value={typeof a.overall_score === 'number' ? a.overall_score.toFixed(2) : '—'} />
            <Stat label="Tier" value={a.performance_tier || '—'} accent={a.overall_score < 2.5 ? 'red' : null} />
            <Stat label="Transcript confidence" value={(m.transcript_confidence_pct || a.transcriptConfidence || '—') + (typeof (m.transcript_confidence_pct || a.transcriptConfidence) === 'number' ? '%' : '')} />
          </div>
          <div className="bg-white border rounded p-4 mb-4">
            <div className="font-semibold mb-1">TL;DR</div>
            <div className="text-sm">{a.tldr || '—'}</div>
          </div>

          <h3 className="font-semibold mb-2">Dimensions</h3>
          <div className="bg-white border rounded overflow-x-auto mb-4">
            <table className="w-full text-sm">
              <thead className="bg-slate-100 text-left">
                <tr><th className="p-2">#</th><th className="p-2">Dimension</th><th className="p-2">Score</th><th className="p-2">Rationale</th></tr>
              </thead>
              <tbody>
                {(a.dimensions || []).map(d => (
                  <tr key={d.id} className="border-t">
                    <td className="p-2">{d.id}</td>
                    <td className="p-2">{d.name}</td>
                    <td className="p-2">{d.score ?? <span className="text-slate-400">N/A</span>}</td>
                    <td className="p-2">{d.score_rationale}{d.data_quality_caveat ? <span className="block text-xs text-amber-700">⚠ {d.data_quality_caveat}</span> : null}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {Array.isArray(a.red_flags) && a.red_flags.length > 0 && (
            <div className="bg-red-50 border border-red-200 rounded p-4 mb-4">
              <div className="font-semibold text-red-800 mb-2">Red flags</div>
              <ul className="text-sm space-y-2">
                {a.red_flags.map((f, i) => (
                  <li key={i} className="border-l-2 border-red-400 pl-2">
                    <Pill color="red">{f.severity}</Pill> {f.type} @ {f.timestamp}
                    <div>{f.description}</div>
                    <div className="italic text-slate-600">"{f.evidence_quote}"</div>
                    <div className="text-xs">Review by: {f.recommended_review_by}{f.requires_immediate_review ? ' · IMMEDIATE' : ''}</div>
                  </li>
                ))}
              </ul>
            </div>
          )}

          <div className="grid md:grid-cols-2 gap-4 mb-4">
            <Block title="Strengths" items={a.strengths || []} render={s => (
              <div><span className="font-medium">@ {s.evidence_timestamp}</span> — {s.strength}</div>
            )} />
            <Block title="Areas for improvement" items={a.areas_for_improvement || []} render={s => (
              <div>
                <Pill color={s.priority === 'High' ? 'red' : s.priority === 'Medium' ? 'amber' : 'slate'}>{s.priority}</Pill>{' '}
                <span className="font-medium">@ {s.evidence_timestamp}</span> — {s.issue}
                <div className="text-xs text-slate-600">Coaching: {s.coaching_recommendation}</div>
              </div>
            )} />
          </div>

          <div className="bg-white border rounded p-4 mb-4">
            <div className="font-semibold mb-2">Right of reply</div>
            {replies.length === 0 && <div className="text-sm text-slate-500 mb-2">No instructor response yet.</div>}
            {replies.map((r, i) => (
              <div key={i} className="text-sm border-l-2 border-slate-300 pl-2 mb-2">
                <div className="text-xs text-slate-500">{r.at} — {r.instructorEmail}</div>
                <div>{r.response}</div>
              </div>
            ))}
            <ReplyForm recordID={recordID} onPost={r => setReplies([...replies, r])} />
          </div>

          <div className="bg-white border rounded p-4 mb-4">
            <div className="font-semibold mb-2">Recommended actions</div>
            <ul className="text-sm space-y-1">
              {(a.recommended_actions || []).map((r, i) => (
                <li key={i}>
                  <Pill color="slate">{r.urgency}</Pill> <Pill color="slate">{r.owner}</Pill> {r.action}
                  <div className="text-xs text-slate-600">PM relevance: {r.performance_management_relevance}</div>
                </li>
              ))}
            </ul>
          </div>

          <details className="bg-white border rounded p-4">
            <summary className="font-semibold cursor-pointer">Raw analysis JSON</summary>
            <pre className="text-xs mt-2 overflow-x-auto whitespace-pre-wrap">{JSON.stringify(a, null, 2)}</pre>
          </details>
        </div>
      );
    }

    function ReplyForm({ recordID, onPost }) {
      const [email, setEmail] = useState('');
      const [text, setText] = useState('');
      const [posting, setPosting] = useState(false);
      async function submit() {
        if (!text.trim()) return;
        setPosting(true);
        try {
          const r = await fetch(`/api/right-of-reply/${encodeURIComponent(recordID)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ instructorEmail: email, response: text }),
          });
          if (r.ok) {
            onPost({ at: new Date().toISOString(), instructorEmail: email, response: text });
            setText('');
          }
        } finally { setPosting(false); }
      }
      return (
        <div className="text-sm space-y-2 mt-2">
          <input className="border rounded px-2 py-1 w-full" placeholder="instructor email" value={email} onChange={e => setEmail(e.target.value)} />
          <textarea className="border rounded px-2 py-1 w-full h-20" placeholder="Your written response — context, dispute, or additional information." value={text} onChange={e => setText(e.target.value)} />
          <button onClick={submit} disabled={posting} className="px-3 py-1 bg-slate-900 text-white rounded">{posting ? 'Submitting…' : 'Submit response'}</button>
        </div>
      );
    }

    function Block({ title, items, render }) {
      return (
        <div className="bg-white border rounded p-4">
          <div className="font-semibold mb-2">{title}</div>
          <ul className="text-sm space-y-1">
            {(items || []).map((it, i) => <li key={i}>{render(it)}</li>)}
            {!items.length && <li className="text-slate-500">None recorded.</li>}
          </ul>
        </div>
      );
    }

    function NeedsReviewView({ needsReview }) {
      return (
        <div className="bg-white border rounded p-4">
          <div className="font-semibold mb-2">Instructor stubs awaiting admin enrichment</div>
          <p className="text-sm text-slate-600 mb-3">These were auto-created because the LAD moderator couldn't be matched to a known instructor profile.</p>
          <table className="w-full text-sm">
            <thead className="bg-slate-50">
              <tr className="text-left">
                <th className="p-2">Email</th>
                <th className="p-2">Name</th>
                <th className="p-2">Source</th>
                <th className="p-2">Created</th>
                <th className="p-2"></th>
              </tr>
            </thead>
            <tbody>
              {needsReview.map(i => (
                <tr key={i.email} className="border-t">
                  <td className="p-2">{i.email}</td>
                  <td className="p-2">{i.name}</td>
                  <td className="p-2">{i.createdFrom}</td>
                  <td className="p-2">{i.createdAt}</td>
                  <td className="p-2"><a className="text-blue-600 hover:underline" href="/admin-override">Resolve →</a></td>
                </tr>
              ))}
              {!needsReview.length && <tr><td colSpan={5} className="p-4 text-center text-slate-500">Nothing needs review. ✓</td></tr>}
            </tbody>
          </table>
        </div>
      );
    }

    function AlertsView() {
      const [items, setItems] = useState([]);
      useEffect(() => {
        // /api/analyses already tells us which sessions had alerts. We can also
        // surface the alert-log entries directly via a follow-up endpoint if added.
        fetchJson('/api/analyses').then(d => setItems((d.analyses || []).filter(a => a.hasRedFlags || a.overallScore < 2.5)));
      }, []);
      return (
        <div className="bg-white border rounded overflow-x-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-100 text-left">
              <tr><th className="p-2">Date</th><th className="p-2">Instructor</th><th className="p-2">Score</th><th className="p-2">Tier</th><th className="p-2">Red Flag</th></tr>
            </thead>
            <tbody>
              {items.map(a => (
                <tr key={a.recordID} className="border-t">
                  <td className="p-2">{a.sessionDate}</td>
                  <td className="p-2">{a.instructorName || a.instructorEmail}</td>
                  <td className="p-2">{typeof a.overallScore === 'number' ? a.overallScore.toFixed(2) : '—'}</td>
                  <td className="p-2">{a.tier}</td>
                  <td className="p-2">{a.hasRedFlags ? <Pill color="red">flag</Pill> : ''}</td>
                </tr>
              ))}
              {!items.length && <tr><td colSpan={5} className="p-4 text-center text-slate-500">No alerts.</td></tr>}
            </tbody>
          </table>
        </div>
      );
    }

    function SystemView({ status }) {
      if (!status) return <div className="text-slate-500">Loading…</div>;
      return (
        <div className="space-y-4">
          <div className="bg-white border rounded p-4">
            <div className="font-semibold mb-2">External services</div>
            <ul className="text-sm space-y-1">
              <li>BBB: {status.bbb.configured ? <Pill color="green">configured</Pill> : <Pill color="red">missing secrets</Pill>}</li>
              <li>Anthropic: {status.anthropic.configured ? <Pill color="green">configured ({status.anthropic.model})</Pill> : <Pill color="red">missing secrets</Pill>}</li>
              <li>Deepgram: {status.deepgram.configured ? <Pill color="green">configured</Pill> : <Pill color="red">missing secrets</Pill>}</li>
              <li>Moodle: {status.moodle.configured ? <Pill color="green">configured</Pill> : <Pill color="red">missing secrets</Pill>}</li>
              <li>Replit DB: {status.replitDb.configured ? <Pill color="green">connected</Pill> : <Pill color="amber">in-memory fallback (data won't persist)</Pill>}</li>
            </ul>
          </div>
          <div className="bg-white border rounded p-4">
            <div className="font-semibold mb-2">Budget</div>
            <div className="text-sm">
              Month: {status.budget.month} · Spent: ${status.budget.totalUsd} / ${status.budget.budgetUsd} · Remaining: ${status.budget.remainingUsd} · Calls: {status.budget.calls}
            </div>
            {status.budget.overBudget && <div className="text-red-700 text-sm mt-1">⚠ Over budget — pipeline will refuse new analyses until reset.</div>}
          </div>
          <div className="bg-white border rounded p-4">
            <div className="font-semibold mb-2">Cron</div>
            <div className="text-sm">{status.cron.enabled ? `Enabled — schedule "${status.cron.schedule}"` : 'Disabled'}</div>
          </div>
          <div className="bg-white border rounded p-4">
            <div className="font-semibold mb-2">Processed</div>
            <div className="text-sm">{status.processedCount} recording(s) processed end-to-end.</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
